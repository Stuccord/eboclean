<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5fb" />
    <title>Eboclean: offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5fb; color: #1e1b4b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
      img { width: 88px; height: 88px; }
      h1 { font-size: 26px; margin: 20px 0 8px; }
      p { color: rgba(30, 27, 75, 0.6); max-width: 300px; margin: 0 auto 24px; line-height: 1.5; }
      button { background: #7c3aed; color: #fff; border: 0; border-radius: 16px; padding: 14px 28px; font-size: 16px; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Eboclean" />
      <h1>You're offline</h1>
      <p>No worries. Reconnect and Eboclean will pick up right where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
